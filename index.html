<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pangea Map with All Points</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100vh; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiYXJvc2VtZW5hIiwiYSI6ImNtOXhjajcxMzBwOG0ya3BwZnF0ZW1xZnUifQ.sxwasp_unopkdy_4jpzGLQ';

  const geojson = {
    "type": "FeatureCollection",
    "features": [
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-74.85665309214839, 5.887834354521789]},
        "properties": {"title": "RioClaro", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1/project-three-8zgh7-absaw"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-74.8594071667184, 5.884638208584613]},
        "properties": {"title": "Indio", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1/project-three-sng7y-2d6ky"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-74.83388500888657, 5.82923051896804]},
        "properties": {"title": "Gruta", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1/project-three-sng7y-2d6ky"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-74.83863100091527, 5.788188720353955]},
        "properties": {"title": "Caiman", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1/project-three-sng7y-2d6ky"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-74.80128485634053, 6.077536916090567]},
        "properties": {"title": "Buho", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1/project-three-sng7y-2d6ky"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-74.80942028937636, 6.034659759212882]},
        "properties": {"title": "Caritas", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1/project-three-sng7y-2d6ky"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-73.82285158238034, 6.076063097104139]},
        "properties": {"title": "Peñon", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-78.24137679832728, 8.034911593858046]},
        "properties": {"title": "Jaque", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-69.49847351963966, -1.312109623524591]},
        "properties": {"title": "Pedrera", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-73.8039275918112, 10.469029787273008]},
        "properties": {"title": "SierraNevada", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-72.56376962537048, -0.306056972667243]},
        "properties": {"title": "Chiribiquete", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1"}
      },
      {
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [-75.32487604121965, 2.991869156126442]},
        "properties": {"title": "MagdalenaBasin", "url": "https://arosemena-portfolio.squarespace.com/portfolio-2-1"}
      }
    ]
  };

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/light-v10',
    center: [0, 0],
    zoom: 2
  });

  map.on('load', () => {
    map.addSource('sites', {
      type: 'geojson',
      data: geojson
    });

    map.addLayer({
      id: 'site-points',
      type: 'circle',
      source: 'sites',
      paint: {
        'circle-radius': 6,
        'circle-color': '#007cbf'
      }
    });

    map.on('click', 'site-points', (e) => {
      const coordinates = e.features[0].geometry.coordinates.slice();
      const props = e.features[0].properties;

      new mapboxgl.Popup()
        .setLngLat(coordinates)
        .setHTML(`<strong>${props.title}</strong><br><a href="${props.url}" target="_blank">Open Project</a>`)
        .addTo(map);
    });

    map.on('mouseenter', 'site-points', () => {
      map.getCanvas().style.cursor = 'pointer';
    });

    map.on('mouseleave', 'site-points', () => {
      map.getCanvas().style.cursor = '';
    });

    // Fit the map to all points
    const bounds = new mapboxgl.LngLatBounds();
    geojson.features.forEach(function(feature) {
      bounds.extend(feature.geometry.coordinates);
    });
    map.fitBounds(bounds, { padding: 60 });
  });
</script>
</body>
</html>
